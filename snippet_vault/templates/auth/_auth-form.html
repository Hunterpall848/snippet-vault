<!DOCTYPE html>

<html>

    <div id="auth-container">
        <form>
            <div class="form-group">
               <label for="username">Username</label> 
               <input 
               type="username" 
               name="username" 
               placeholder="...">
            </div>

            <div class="form-group">
               <label for="password">Password</label> 
               <input 
               type="password" 
               name="password" 
               placeholder="...">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</html>
